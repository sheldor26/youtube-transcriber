name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Enforce the per-module line-count ceiling (see MISTAKES.md M-0003)
        run: |
          over=$(find app -name '*.py' -exec wc -l {} \; | awk '$1 > 500 { print }')
          if [ -n "$over" ]; then
            echo "These modules are past the 500-line ceiling documented in ARCHITECTURE.md:"
            echo "$over"
            echo "Split the module instead of raising the ceiling."
            exit 1
          fi

      - name: Check for leftover Spanish strings (see MISTAKES.md M-0004)
        run: |
          leaks=$(grep -rlP "[áéíóúñÁÉÍÓÚÑ¿¡]" app/*.py 2>/dev/null | grep -v '^app/content.py$' || true)
          if [ -n "$leaks" ]; then
            echo "These files have Spanish characters outside content.py, which is the only module allowed them (it processes Spanish/Portuguese transcript text, not UI strings):"
            echo "$leaks"
            exit 1
          fi
